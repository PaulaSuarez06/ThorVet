spring.application.name=ThorVetMVC

# El MVC en otro puerto: la API REST ya ocupa el 8083
server.port=${PORT:8080}

# URL base de la API REST (Thorvet)
api.thorvet.base-url=${API_THORVET_BASE_URL:http://localhost:8083}

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

spring.messages.encoding=UTF-8

logging.level.org.springframework.security=DEBUG
logging.level.com.example.thorvetmvc=TRACE
