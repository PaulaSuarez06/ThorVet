<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel principal · Thorvet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { min-height: 100vh; background: #f6f4f0; font-family: Manrope, system-ui, sans-serif; color: oklch(0.28 0.01 90); display: flex; flex-direction: column; }
    a { color: oklch(0.52 0.09 190); text-decoration: none; }
    a:hover { color: oklch(0.42 0.09 190); text-decoration: underline; }

    header { display: flex; align-items: center; justify-content: space-between; padding: 20px 40px; border-bottom: 1px solid oklch(0.90 0.008 90); }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(155deg, oklch(0.58 0.09 190), oklch(0.46 0.09 190));
      display: grid; place-items: center; box-shadow: 0 6px 16px -8px oklch(0.46 0.09 190 / .55); flex: none; }
    .paw { position: relative; width: 20px; height: 18px; }
    .paw span { position: absolute; background: #fff; }
    .paw .ear-l { width: 6px; height: 11px; border-radius: 45% 45% 55% 55%; top: 1px; left: -1px; transform: rotate(14deg); transform-origin: top center; }
    .paw .ear-r { width: 6px; height: 11px; border-radius: 45% 45% 55% 55%; top: 1px; right: -1px; transform: rotate(-14deg); transform-origin: top center; }
    .paw .head { width: 12px; height: 11px; border-radius: 50%; top: 4px; left: 4px; }
    .paw .nose { width: 2px; height: 2px; border-radius: 50%; background: oklch(0.52 0.09 190); bottom: 2px; left: 9px; }
    .brand-name { font-family: 'Instrument Serif', serif; font-size: 22px; line-height: 1; }
    .logout { font-family: inherit; font-size: 13.5px; font-weight: 600; color: oklch(0.45 0.01 90); background: transparent;
      border: 1px solid oklch(0.88 0.008 90); border-radius: 8px; padding: 9px 16px; cursor: pointer; white-space: nowrap; }
    .logout:hover { background: oklch(0.96 0.008 90); }

    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 24px; gap: 48px; }
    .title { display: flex; flex-direction: column; gap: 8px; text-align: center; }
    .title h1 { margin: 0; font-size: 32px; font-weight: 600; letter-spacing: -.02em; }
    .title p { margin: 0; font-size: 15px; color: oklch(0.55 0.01 90); }

    .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 24px; width: 100%; max-width: 720px; }
    .card { flex: 1 1 260px; min-width: 240px; background: #fffefb; border: 1px solid oklch(0.90 0.008 90); border-radius: 18px;
      padding: 32px 28px; display: flex; flex-direction: column; gap: 16px;
      box-shadow: 0 1px 2px rgba(40,35,25,.04), 0 12px 32px -18px rgba(40,35,25,.25);
      transition: transform .14s ease, box-shadow .14s ease; text-decoration: none; }
    .card:hover { transform: translateY(-3px); box-shadow: 0 4px 8px rgba(40,35,25,.05), 0 20px 40px -18px rgba(40,35,25,.32); text-decoration: none; }
    .icon-box { width: 48px; height: 48px; border-radius: 14px; background: oklch(0.94 0.03 190); display: grid; place-items: center; }
    .icon-box .paw span { background: oklch(0.46 0.09 190); }
    .icon-box .paw .nose { background: oklch(0.94 0.03 190); }
    .icon-box .vet { width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid oklch(0.46 0.09 190); position: relative; }
    .icon-box .vet span { position: absolute; background: oklch(0.46 0.09 190); }
    .icon-box .vet .head { width: 5px; height: 5px; border-radius: 50%; top: 2px; left: 6.5px; }
    .icon-box .vet .body { width: 12px; height: 7px; border-radius: 6px 6px 0 0; bottom: 1px; left: 3px; }
    .card-text { display: flex; flex-direction: column; gap: 4px; }
    .card-text .name { font-size: 18px; font-weight: 600; color: oklch(0.28 0.01 90); }
    .card-text .desc { font-size: 13.5px; color: oklch(0.55 0.01 90); line-height: 1.4; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-mark">
        <div class="paw"><span class="ear-l"></span><span class="ear-r"></span><span class="head"></span><span class="nose"></span></div>
      </div>
      <span class="brand-name">Thorvet</span>
    </div>
    <form th:action="@{/logout}" method="post" style="margin:0">
      <button type="submit" class="logout">Cerrar sesión</button>
    </form>
  </header>

  <main>
    <div class="title">
      <h1>Panel principal</h1>
      <p>Elige qué quieres gestionar hoy.</p>
    </div>

    <div class="grid">
      <a class="card" th:href="@{/mascotas}">
        <div class="icon-box">
          <div class="paw"><span class="ear-l"></span><span class="ear-r"></span><span class="head"></span><span class="nose"></span></div>
        </div>
        <div class="card-text">
          <span class="name">Ver mascotas</span>
          <span class="desc">Consulta el listado de mascotas registradas y sus historiales.</span>
        </div>
      </a>

      <a class="card" th:href="@{/veterinarios}">
        <div class="icon-box">
          <div class="vet"><span class="head"></span><span class="body"></span></div>
        </div>
        <div class="card-text">
          <span class="name">Ver veterinarios</span>
          <span class="desc">Consulta el equipo veterinario disponible en la clínica.</span>
        </div>
      </a>
    </div>
  </main>
</body>
</html>
